<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proyectos | Evelin Visney</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Evelin Visney</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre-mi.html">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link active" href="proyectos.html">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Encabezado -->
  <header class="bg-primary text-white text-center py-5">
    <h1 class="display-5">Mis Proyectos</h1>
    <p class="lead">Aquí puedes explorar algunos de mis trabajos destacados</p>
  </header>

  <!-- Galería de proyectos -->
  <section class="container my-5">
    <div class="row" id="gallery">
      <!-- Reemplaza estas imágenes con tus proyectos -->
      <div class="col-md-4 mb-4">
        <img src="img/Amanita_Muscaria.png" class="img-fluid rounded project-img" alt="Amanita Muscaria" data-index="0">
      </div>
      <div class="col-md-4 mb-4">
        <img src="img/Boletus_Edulis.jpg" class="img-fluid rounded project-img" alt="Boletus Edulis" data-index="1">
      </div>
      <div class="col-md-4 mb-4">
        <img src="img/Cordyceps.jpg" class="img-fluid rounded project-img" alt="Cordyceps" data-index="2">
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-white">
        <div class="modal-body text-center">
          <img id="modal-img" src="" class="img-fluid rounded" alt="">
        </div>
        <div class="modal-footer justify-content-between">
          <button id="prev-btn" class="btn btn-outline-light">Anterior</button>
          <button id="next-btn" class="btn btn-outline-light">Siguiente</button>
          <button class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
